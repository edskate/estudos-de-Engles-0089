<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronuncia 03 </title>
    <style>
        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
            margin: 15% ;
            text-shadow: 2px 2px 2px yellow;
        
        }

        i {
            color: #e1f507;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
            font-family: Arial, sans-serif;
            font-variant: small-caps;
            font-variant-caps: all-small-caps;
            font-variant-numeric: proportional-nums;
            font-size: 30px;
        }

        em {
            color: #02f236;
            font-size: 20px;
            margin-top: 15px;
            text-shadow: 2px 2px 2px #000000;
            font-weight: bold;
            font-style: italic;
            font-family: Arial, sans-serif;
            font-variant: small-caps;
            font-variant-caps: all-small-caps;
            font-variant-numeric: proportional-nums;
            font-size: 30px;
            text-shadow:2px 2px 2px red;
        }
        div {
            margin-top: 20px;
            width: 55%;
            height: 50%;
            border : 3px solid #02f236;
            text-align: center;
            box-shadow: 3px 3px 3px #fa0404;


        }
    </style>
</head>
<body>
    <h1>Pronuncia 03:</h1>
<div>
    <i>smart class</i><br>
    <em>classe inteligente</em><br>

    <i>smart phone</i><br>
    <em>telefone inteligente</em><br>

    <i>smart watch</i><br>
    <em>relógio inteligente</em><br>

</div>
<hr>

<i>ghost and ghost busters</i><br>
<em>fantasma e caça-fantasmas</em><br>


</body>
</html>
